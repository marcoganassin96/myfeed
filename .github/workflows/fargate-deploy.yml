name: Fargate Deploy

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: newsletter
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: newsletter
        run: pytest tests/ -v --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: ECR login
        run: |
          aws ecr get-login-password --region eu-west-1 \
            | docker login --username AWS --password-stdin \
                "$(echo "${{ vars.ECR_REPO_URL }}" | cut -d/ -f1)"

      - name: Build and push Docker image
        run: |
          docker build -f newsletter/Dockerfile -t "${{ vars.ECR_REPO_URL }}:latest" .
          docker push "${{ vars.ECR_REPO_URL }}:latest"

      - name: Force ECS redeployment
        run: |
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --desired-count 1 \
            --force-new-deployment \
            --region eu-west-1 \
            --output json > /dev/null

      - name: Wait for service stable
        timeout-minutes: 10
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}" \
            --region eu-west-1

      - name: Smoke test
        run: |
          curl -f --retry 3 --retry-delay 5 \
            "http://${{ vars.ALB_DNS }}/health"
