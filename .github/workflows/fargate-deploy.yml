name: Fargate Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "newsletter-dev"
        type: choice
        options:
          - newsletter-dev
          - newsletter-prd

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: newsletter
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: newsletter
        run: pytest tests/ -v --tb=short

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Derive env
        run: |
          INPUT="${{ inputs.environment }}"
          echo "APP_ENV=${INPUT##*-}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: ECR login
        run: |
          aws ecr get-login-password --region eu-west-1 \
            | docker login --username AWS --password-stdin \
                "$(echo "${{ vars.ECR_REPO_URL }}" | cut -d/ -f1)"

      - name: Build and push Docker image
        run: |
          docker build -f newsletter/Dockerfile \
            -t "${{ vars.ECR_REPO_URL }}:${{ env.APP_ENV }}" \
            -t "${{ vars.ECR_REPO_URL }}:latest" .
          docker push "${{ vars.ECR_REPO_URL }}:${{ env.APP_ENV }}"
          docker push "${{ vars.ECR_REPO_URL }}:latest"

      - name: Force ECS redeployment
        run: |
          TASK_DEF_FAMILY="${{ vars.ECS_SERVICE }}"
          TASK_DEF_FAMILY="${TASK_DEF_FAMILY%-svc}"
          LATEST_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_FAMILY" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text \
            --region eu-west-1)
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --task-definition "$LATEST_TASK_DEF" \
            --desired-count 1 \
            --force-new-deployment \
            --region eu-west-1 \
            --output json > /dev/null

      - name: Wait for service stable
        timeout-minutes: 10
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_SERVICE }}" \
            --region eu-west-1

      - name: Smoke test
        run: |
          curl -f --retry 3 --retry-delay 5 \
            "http://${{ vars.ALB_DNS }}/health"
