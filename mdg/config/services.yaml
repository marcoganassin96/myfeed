services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $redisUrl: '%mdg.redis_url%'
            int $cacheTtl: '%mdg.cache_ttl%'
            string $adminToken: '%env(ADMIN_TOKEN)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Cache\RedisClientInterface: '@App\Cache\PredisAdapter'

