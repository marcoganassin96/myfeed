nelmio_api_doc:
    documentation:
        info:
            title: 'Master Data Gateway'
            description: 'Internal API for newsletter master data'
            version: '1.0.0'
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - bearerAuth: []
    areas:
        default:
            path_patterns:
                - ^/master-data
